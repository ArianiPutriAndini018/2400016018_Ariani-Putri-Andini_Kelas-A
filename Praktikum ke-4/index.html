<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Useless Facts</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen flex items-center justify-center">

  <div class="text-center px-4">
    <h1 class="text-4xl font-bold text-gray-800 mb-10 flex items-center justify-center gap-3">
      Random Useless Facts🤪
    </h1>

    <div class="bg-white shadow-xl p-10 rounded-3xl w-full max-w-2xl">
      <p id="fact" class="text-xl text-gray-700 leading-relaxed text-center">
        Loading...
      </p>

      <button id="generateBtn"
        class="mt-10 bg-gradient-to-r from-blue-500 to-indigo-600 text-white px-8 py-3 rounded-xl text-lg font-semibold shadow hover:opacity-90 active:scale-95 transition flex items-center gap-2 mx-auto">
        🔄 Get Another Random Fact
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
